    trace-generator:
      container_name: trace-generator
      image: pointertrace/tracegenerator:nightly
      environment:
        - TRACES_PER_SECOND=100000
        - DURATION_SECONDS=60
#        - TRACES_PER_SECOND=100000
#        - DURATION_SECONDS=120
        - EXPORT_GRPC_PORT=8081
        - EXPORT_GRPC_HOST=siglet
        - COMPARISON_GRPC_PORT=8082
        - POST_GENERATION_WAIT_SECONDS=30
        - LOG_RECEIVED_SPANS=false
      profiles:
        - generate

    generate-trace:
      container_name: generate-trace
      image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
      command: >
        traces \
          --otlp-insecure \
          --otlp-endpoint localhost:8081 \
          --rate 10000 \
          --duration=2m
      profiles:
        - debug
