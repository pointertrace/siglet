version: '3.8'

services:
    otel-collector:
      container_name: otel-collector
      image: otel/opentelemetry-collector-contrib:latest
      command: [ "--config=/etc/otel-collector-config.yaml" ]
      volumes:
        - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
      ports:
        - "4317:4317"   # OTLP gRPC
        - "4318:4318"   # OTLP HTTP
      depends_on:
        - siglet
    otel-lgtm:
      container_name: grafana
      image: grafana/otel-lgtm:latest
      ports:
        - "3000:3000"
      environment:
        - ENABLE_LOGS_ALL=true
    siglet:
      container_name: siglet
      image: pointertrace/siglet:nightly
      command: --config=/opt/siglet-config.yaml --siglet=/opt/spanlet.jar
      ports:
        - "8081:8081"
      volumes:
        - ./target/fatjar-suffix-spanlet.jar:/opt/spanlet.jar
        - ./siglet-config.yaml:/opt/siglet-config.yaml
      depends_on:
        - otel-lgtm
    generate-trace:
      container_name: generate-trace
      image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
      command: >
        traces \
          --otlp-insecure \
          --otlp-endpoint otel-collector:4317 \
          --rate 10000 \
          --duration=2m
      profiles:
        - debug
      depends_on:
        - otel-collector
