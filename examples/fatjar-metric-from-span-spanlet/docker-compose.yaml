version: '3.8'

services:
    otel-lgtm:
      container_name: grafana
      image: grafana/otel-lgtm:latest
      ports:
        - "3000:3000"
      environment:
        - ENABLE_LOGS_ALL=true
    siglet:
      container_name: siglet
      image: pointertrace/siglet:nightly
      command: --config=/opt/siglet-config.yaml --siglet=/opt/spanlet.jar
      ports:
        - "8081:8081"
      volumes:
        - ./target/fatjar-metric-from-span-spanlet.jar:/opt/spanlet.jar
        - ./siglet-config.yaml:/opt/siglet-config.yaml
      depends_on:
        - otel-lgtm
    generate-trace:
      container_name: generate-trace
      image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
      command: >
        traces \
          --otlp-insecure \
          --otlp-endpoint siglet:8081 \
          --traces 100
      profiles:
        - debug
      depends_on:
        - siglet
