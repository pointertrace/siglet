name: Java CI with Maven and Docker

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and deploy to Maven Central
        run: ./mvnw package

      - name: Build Docker container
        run: cd implementation && ./build-docker-container.sh

      - name: Push Docker container
        run: cd implementation && ./push-docker-container.sh