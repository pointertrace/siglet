cenarios:
  empty:
    siglet-config-yaml: ""
    error-message: Siglet config file is empty

  empty-global-config:
    siglet-config-yaml:
      global:
      pipelines:
        - name: pipeline
          from: receiver
          start: spanlet
          processors:
            - spanlet-groovy-action: spanlet
              to: exporter
              config:
                action: signal.name = signal.name +"-suffix"
    error-message: |
      Error in configuration:
        Error in global configuration:
          Expecting object at (1,9):
            (1,9) Expected object


  global-config-invalid-property:
    siglet-config-yaml:
      global:
        invalid-property: value
      receivers:
        debug: receiver
      pipelines:
        - name: pipeline
          from: receiver
          start: spanlet
          processors:
            - spanlet-groovy-action: spanlet
              to: exporter
              config:
                action: signal.name = signal.name +"-suffix"
    error-message: |
      Error in configuration:
        Error in global configuration:
          Expecting object at (2,3):
            (2,3) Unknown property: invalid-property



  global-config-queue-size-not-int:
    siglet-config-yaml:
